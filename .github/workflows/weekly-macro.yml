name: Weekly Macro Article

on:
  schedule:
    # 매주 토요일 한국시간 오전 9시 = UTC 0시
    - cron: '0 0 * * 6'
  workflow_dispatch: # 수동 실행 가능
    inputs:
      dry_run:
        description: "시험 실행 — 금리 수집 후 글 생성 직전에서 멈추고 수집한 금리와 생성 입력만 출력(글 생성·커밋 안 함)"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # 시험 실행(미션 9): 수집 결과는 임시 파일에만 쓰고, 생성 입력을 출력한 뒤 끝낸다. 유료 API 키를 넘기지 않는다
      - name: Dry run — collect rates and print generation input
        if: ${{ inputs.dry_run }}
        run: |
          npx tsx lib/news-collector.ts --out "$RUNNER_TEMP/fed-news.json"
          npx tsx lib/article-writer.ts --dry-run "$RUNNER_TEMP/fed-news.json"

      # 금리는 연준 이사회 H.15 에서 받는다(미션 8). FRED_API_KEY 는 SITE_DATA_SOURCE=fred 로 되돌릴 때만 쓴다
      - name: Collect news & rate data (Fed H.15)
        if: ${{ !inputs.dry_run }}
        run: npx tsx lib/news-collector.ts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Generate macro article
        if: ${{ !inputs.dry_run }}
        run: npx tsx lib/article-writer.ts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/fed-rate/ data/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            git commit -m "Auto-generate weekly macro article $(date +%Y-%m-%d)"
            git push
          fi
